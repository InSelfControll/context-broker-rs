[package]
name = "context-broker"
version = "0.4.0"
edition = "2024"
description = "Token-lean semantic code search and project memory MCP server"
license = "PolyForm-Noncommercial-1.0.0"
authors = ["Ofir (InSelfControll)"]
repository = "https://github.com/InSelfControll/context-broker-rs"
readme = "README.md"
keywords = ["mcp", "semantic-search", "code-search", "embeddings", "llm"]
categories = ["command-line-utilities", "development-tools", "text-processing"]

[dependencies]
candle-core = "0.11.1"
candle-nn = "0.11.1"
candle-transformers = "0.11.1"
globset = "0.4.21"
ignore = "0.4.34"
jsonwebtoken = { version = "10.3.0", default-features = false, features = ["rust_crypto", "use_pem"] }
libc = "0.2.191"
regex = "1.13.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tiny_http = "0.12.0"
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"] }
ureq = "3.5.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"

# Static (musl) builds: musl's own allocator is slow under threads, so use mimalloc there.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1.52", default-features = false }
libmimalloc-sys = { version = "0.1.49", default-features = false, features = ["extended"] }
